<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Contact Form — {{APP_NAME}}</title>
</head>
<body style="margin:0;padding:0;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5;padding:48px 0;">
    <tr><td align="center">
      <table width="580" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

        <tr>
          <td style="background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);padding:40px 48px;">
            <span style="color:#ffffff;font-size:20px;font-weight:800;letter-spacing:-0.5px;">{{APP_NAME}}</span>
            <span style="display:inline-block;margin-left:12px;background:#16a34a;color:#ffffff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.5px;vertical-align:middle;">ADMIN</span>
            <p style="margin:8px 0 0;color:#94a3b8;font-size:13px;">New Contact Form Submission</p>
          </td>
        </tr>

        <tr>
          <td style="padding:40px 48px;">
            <div style="border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;margin-bottom:28px;">
              <table cellpadding="0" cellspacing="0" width="100%">
                <tr style="background:#f8fafc;">
                  <td colspan="2" style="padding:14px 24px;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;">Sender Information</td>
                </tr>
                <tr style="border-top:1px solid #f1f5f9;">
                  <td style="padding:14px 24px;font-size:13px;color:#64748b;font-weight:600;width:35%;">Name</td>
                  <td style="padding:14px 24px;font-size:13px;color:#1e293b;font-weight:700;">{{senderName}}</td>
                </tr>
                <tr style="border-top:1px solid #f1f5f9;background:#fafafa;">
                  <td style="padding:14px 24px;font-size:13px;color:#64748b;font-weight:600;">Email</td>
                  <td style="padding:14px 24px;font-size:13px;font-weight:700;">
                    <a href="mailto:{{senderEmail}}" style="color:#16a34a;text-decoration:none;">{{senderEmail}}</a>
                  </td>
                </tr>
                <tr style="border-top:1px solid #f1f5f9;">
                  <td style="padding:14px 24px;font-size:13px;color:#64748b;font-weight:600;">Subject</td>
                  <td style="padding:14px 24px;font-size:13px;color:#1e293b;font-weight:700;">{{subject}}</td>
                </tr>
              </table>
            </div>

            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:24px;">
              <p style="margin:0 0 14px;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;">Message</p>
              <p style="margin:0;font-size:14px;color:#334155;line-height:1.8;white-space:pre-line;">{{message}}</p>
            </div>
          </td>
        </tr>

        <tr>
          <td style="background:#f8fafc;border-top:1px solid #f1f5f9;padding:24px 48px;">
            <p style="margin:0;font-size:11px;color:#cbd5e1;">© {{YEAR}} {{APP_NAME}} · Admin Notification</p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
